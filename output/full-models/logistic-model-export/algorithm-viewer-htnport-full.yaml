# This is an algorithm configuration file to be used with the Algorithm Viewer,
# which allows you to visualize the algorithm with plots.
# The Algorithm Viewer GitHub repository can be found at:
# https://github.com/Big-Life-Lab/algorithm-viewer

meta:
  algorithm: HTNPoRT Full
  version: 1.0.0

models:
  female:
    title: Female
    model_export: ./female-full/HTNPoRT-full-female-model-export.csv
    reference_group:
      hwmdbmi: 14.9           # kg/m²
    predictor_allowable_values:
      hwmdbmi:
        seq:
          from: 14.9
          to: 49
          by: 0.1
  male:
    title: Male
    model_export: ./male-full/HTNPoRT-full-male-model-export.csv
    reference_group:
      hwmdbmi: 13.8           # kg/m²
    predictor_allowable_values:
      hwmdbmi:
        seq:
          from: 13.8
          to: 49
          by: 0.1
  _all_:
    reference_group:
      clc_age: 20             # years
      married: 1              # Married or common-law
      edudr04: 3              # Post-secondary
      working: 1              # Working
      gendmhi: 2              # Good, very good, or excellent
      gen_025: 1              # Not at all to a bit stressed
      gen_045: 1              # Strong
      fmh_15: 2               # No
      low_drink_score1: 1     # Never drank
      minperweek: 0           # minutes/week
      smoke: 3                # Never smoker
      slp_11: 2               # hours/night
      totalfv: 0              # times/day
      diabx: 2                # No
      ckd: 2                  # No
